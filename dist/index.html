</style><link rel="stylesheet" href="playhouse.css"></head><body><main class="main"><header><h1>灯下百戏 <i></i><small>借影搭桥</small></h1><div class="header-actions"><button id="sound" aria-pressed="true">声音开</button><button id="reset" title="重置本机游戏进度">重开</button></div></header><div class="hud"><div class="location"><small id="actNumber"></small><h2 id="place"></h2><span id="chapter"></span></div><span id="role"></span></div><section class="stage" aria-label="戏台游戏画面"><svg class="scene" viewBox="0 0 1000 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="阿照在台前操灯，拾影站在后方影幕的剪影上。">

<section id="alcove" hidden aria-labelledby="alcoveTitle"><canvas id="alcoveScene" aria-hidden="true"></canvas><div class="alcove-head"><small id="alcoveAct"></small><h2 id="alcoveTitle" tabindex="-1"></h2><p id="alcoveClue"></p></div><div id="instruments"></div><div class="alcove-foot"><p id="alcoveFeedback" aria-live="polite"></p><button id="repeatCue" type="button">再听一遍</button></div></section><div id="shutter" aria-hidden="true"></div><div class="sceneLight" aria-hidden="true"></div><div class="dialog" aria-live="polite"><strong id="speaker"></strong><p id="dialog"></p><div id="projection" hidden aria-label="投影与左右桥墩的对齐情况"><i></i><b></b><em></em></div></div><div class="overlay" id="overlay"><div class="panel"><div class="kicker">北京皮影戏</div><h2>借影搭桥</h2><p>阿照落了门闩，刚把钥匙揣好，幕布后头有人敲了三下。她提着空灯回去。灯盏竟是满的，盏沿还挂着一滴油。</p><button class="primary" id="start">入戏</button><p class="hint">自动保存在当前设备的浏览器中</p></div></div></section><div id="propCommands" aria-label="机关操作"></div><div class="controls"><button id="left">向左</button><button id="right">向右</button><button class="primary" id="action">互动</button><button id="switch">切换角色</button><button id="hint">提示</button><button id="portrait" disabled>人物特写</button><button id="carry" hidden>搬动木椅</button><button id="inspect" hidden>查看匣背</button><button id="view">戏台全景</button></div><div class="toolDrawer folded" id="drawer" inert><div class="toolClip"><section class="tools" id="tools"><strong id="toolTitle"></strong><label id="chairLabel">移动椅子 <input id="chair" type="range" min="0" max="100" value="25"><output id="chairOut"></output></label><label id="lampLabel">调整灯光 <input id="lamp" type="range" min="0" max="100" value="25"><output id="lampOut"></output></label><label id="angleLabel">转动视角 <input id="angle" type="range" min="0" max="100" value="15"><output id="angleOut"></output></label><div class="hint" id="feedback"></div></section></div></div><p class="hint guide" id="guide"></p></main><script src="sound.js"></script><script src="mechanism.js"></script><script src="room.js"></script><script src="stage.js"></script><script>
'use strict';
const el=id=>document.getElementById(id);
const key='dengxia-shadow-v2';
const initial=()=>({stage:0,role:'a',a:13,b:27,chair:25,lamp:25,angle:15,alcove:"",chimes:0,tiles:[1,3,2]});
function restore(){
  const state=initial();
  try {
    const old=JSON.parse(localStorage.getItem(key));
    if(!old||!Number.isInteger(old.stage)||old.stage<0||old.stage>4)return state;
    state.stage=old.stage;state.role=old.role==='b'&&old.stage?'b':'a';
    for(const k of ['a','b','chair','lamp','angle']){
      if(Number.isFinite(old[k]))state[k]=Math.max(0,Math.min(100,old[k]));
    }
    if((old.passage===2||old.passage===3)&&old.passage===state.stage+1){
      state.stage=old.passage;
    }
    if((old.alcove==='bells'&&state.stage===2)||(old.alcove==='silk'&&state.stage===3)){
      state.alcove=old.alcove;
      if(Number.isInteger(old.chimes)&&old.chimes>=0&&old.chimes<3)state.chimes=old.chimes;
      if(Array.isArray(old.tiles)&&old.tiles.length===3&&old.tiles.every(n=>Number.isInteger(n)&&n>=0&&n<4))state.tiles=old.tiles.slice();
    }
    state.a=Math.max(5,Math.min(88,state.a));
    state.b=Math.max(21,Math.min(76,state.b));
    if(state.stage===1&&state.b>31)state.b=31;
    if(state.stage===3&&state.b>31&&state.b<69&&Math.abs(state.angle-70)>5)state.b=state.b<50?31:69;
  } catch {}
  return state;
}
let s=restore(),playing=false,held=0,pressed=new Set(),last=0,redrawUntil=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function newMotion(){return {phase:0,weight:0,yaw:1.5}}
const visual={look:0,pitch:0,shot:null,started:false,a:s.a,b:s.b,lo:0,hi:0,dir:{a:1,b:1},motion:{a:newMotion(),b:newMotion()}};
const wx=n=>(n-50)*.162;
function isAligned(){
  return s.stage===3?Math.abs(s.angle-70)<=5:Math.abs(s.chair-65)<=5&&Math.abs(s.lamp-55)<=5;
}
function ends(){
  if(s.stage===2||s.stage===4||isAligned())return [33,67];
  if(s.stage===3)return [33+(s.angle-70)*.13,67-Math.abs(s.angle-70)*.25];
  return [33+(s.chair-65)*.16,67+(s.lamp-55)*.32];
}
const scenes=['后台初遇','借影搭桥','踏影过桥','窗棂寻纹','点亮戏台'];
const lines=[
  '谁添的油？师父，你还在里头吗？……我点灯了啊。',
  '你先别往我脸上照。看看椅子底下，那两道白印，是昨晚搬的时候蹭的。',
  '阿照，你听见了吧？我还在这头呢。谁在那边拉铃？',
  '先别拽。窗眼里夹着我那半截袖子。对，就那根红线，我娘缝歪的。',
  '你站着别动。我数一遍。你，我……那门底下的，是谁的脚？'
];
const tips=['走到左侧灯架附近，以阿照互动。','移动椅子让桥头对齐，再调灯让桥尾搭上右岸。对齐后按互动固定影桥。','切换拾影，沿影桥走到右岸，在铜铃旁互动。','用阿照转动视角接通两岸，再切换拾影走到左岸，用长袖拉铃。','演出完成，可以在此自由回看戏台。'];
function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch{}}
let captionKey='',captionTimer;
function caption(name,message){
  const key=name+'|'+message;
  if(key===captionKey)return;
  const first=!captionKey, panel=el('dialog').parentElement;
  captionKey=key;
  clearTimeout(captionTimer);
  const commit=()=>{
    el('speaker').textContent=name;
    el('dialog').textContent=message;
    panel.classList.remove('leaving');
  };
  if(first||reduced){commit();return}
  panel.classList.add('leaving');
  captionTimer=setTimeout(commit,145);
}
function render(note){
  const [lo,hi]=ends();visual.lo=wx(lo);visual.hi=wx(hi);
  const svgX=n=>n*10;
  for(const [id,k] of [['a','a'],['b','b']])el(id).setAttribute('transform','translate('+svgX(s[k])+' '+(k==='a'?389:265)+')');
  el('bridgeDeck').setAttribute('transform','translate('+svgX(lo)+' 0) scale('+((hi-lo)/34)+' 1)');
  el('bridgeDeck').style.opacity=s.stage?1:0;el('b').style.opacity=s.stage?1:0;
  el('goal').setAttribute('transform','translate('+(s.stage===3?250:740)+' 234)');
  el('lampRig').setAttribute('transform','translate('+(110+s.lamp*.6)+' 0)');
  el('prop').setAttribute('transform','translate('+(360+s.chair*2.4)+' 0)');
  el('halo').style.opacity=s.stage===0?.12:s.stage===4?1:.65;
  el('sleeve').style.opacity=s.stage>=3?1:0;
  el('world').style.transform='scale(1.025) translateX('+((s.stage===3?(s.angle-50)*.035:0)+(s.role==='b'?-1:0))+'%)';
  el('chapter').textContent=scenes[s.stage];el('role').textContent=s.role==='a'?'幕外 · 阿照':'幕内 · 拾影';
  caption(note?'戏台':['阿照','拾影','拾影','拾影','阿照'][s.stage],note||lines[s.stage]);
  const folded=!playing||s.role!=='a'||![1,3].includes(s.stage);
  el('drawer').inert=folded;el('drawer').classList.toggle('folded',folded);
  el('chairLabel').hidden=el('lampLabel').hidden=s.stage!==1;el('angleLabel').hidden=s.stage!==3;
  el('toolTitle').textContent=s.stage===3?'旋转窗棂视角':'借椅影，接两岸';
  for(const k of ['chair','lamp','angle']){el(k).value=s[k];el(k+'Out').value=s[k]}
  el('feedback').textContent=isAligned()?(s.stage===3?'窗影相接，换拾影回左岸。':'桥已搭稳，按互动固定。'):'观察桥的两端，使它们与金色标记相接。';
  el('switch').disabled=!playing||s.stage===0||s.stage===4;
  syncImmersion();redrawUntil=performance.now()+3300;
}
function step(dir,amount){
  if(!playing||sceneBusy()||!dir||s.stage===4)return;
  const who=s.role,old=s[who];let pos=old+dir*amount;
  if(who==='b'){
    pos=Math.max(21,Math.min(76,pos));
    if(s.stage===1||(s.stage===3&&!isAligned())){
      pos=old<=33?Math.min(pos,31):Math.max(pos,69);
    }
  }else pos=Math.max(5,Math.min(88,pos));
  s[who]=pos;
  if(pos!==old)visual.dir[who]=dir;
  if(old!==pos){if(!wide){wide=true;syncImmersion()}el(who).setAttribute('transform','translate('+pos*10+' '+(who==='a'?389:265)+')');redrawUntil=performance.now()+2400}

}
function changeStage(n){
  leaveAlcove();
  closePerformance();
  const stage=el('stage3d').parentElement;
  if(!reduced&&typeof stage.animate==='function'){
    stage.querySelector('.sceneLight').animate([{opacity:0},{opacity:.63,offset:.34},{opacity:0}],{duration:900,easing:'ease-in-out'});
    el('chapter').animate([{opacity:.15,transform:'translateY(3px)'},{opacity:1,transform:'translateY(0)'}],{duration:620});
  }
  stopMovement();wide=n===2||n===4;
  stageSound.play(n===4?'end':'transition');s.stage=n;if(n===2)stageSound.play('bell');el('shutter').animate?.([{opacity:.96},{opacity:0}],{duration:reduced?0:850});render();save();
}
function swap(){if(!playing||sceneBusy()||!s.stage||s.stage===4)return;stopMovement();stageSound.play('swap');s.role=s.role==='a'?'b':'a';wide=s.role==='b';render();save()}
function action(){
  if(!playing)return;
  if(s.stage===0&&s.a<=28)return changeStage(1);
  if(s.stage===1&&s.role==='a'&&isAligned())return changeStage(2);
  if(s.stage===2&&s.role==='b'&&s.b>=70)return openAlcove('bells');
  if(s.stage===3&&s.role==='b'&&s.b<=29&&isAligned()){
    openAlcove('silk');return;
  }
  stageSound.play("blocked");render(tips[s.stage]);
}
function curtain(open){el('overlay').classList.toggle('closed',!open);el('overlay').inert=!open}
function endCard(){
  el('overlay').querySelector('h2').textContent='灯亮了，戏还未完';
  el('overlay').querySelector('.panel p').textContent='门底下那双鞋往后退了一步。阿照拔开门闩，胡同里空荡荡的。对面墙上倒映着一个小生，正把袖子卷起来。拾影低头看自己的手。那头又敲了三下。';
  el('start').textContent='回看戏台';playing=false;if(visual.started)render();window.setTimeout(()=>{if(s.stage===4&&!playing)curtain(true)},reduced?0:2450);
}
const card=el('overlay').querySelector('h2').innerHTML,prologue=el('overlay').querySelector('.panel p').textContent;
el('start').onclick=()=>{stageSound.unlock();stageSound.play("open");playing=true;visual.started=true;wide=!s.stage||s.stage===4||s.role==='b';curtain(false);render();if(s.alcove){openAlcove(s.alcove);return}el('action').focus({preventScroll:true})};
if(s.stage===4)endCard();else if(s.stage)el('start').textContent='继续上回';
el('action').onclick=action;el('switch').onclick=swap;el('hint').onclick=()=>{if(playing)render(s.stage===1?'椅轨对准 65 刻，灯座对准 55 刻，再扣锁栓。':s.stage===3?'窗棂对准 70 刻，换拾影走回左岸拉铃。':tips[s.stage])};
el('reset').onclick=()=>{if(!confirm('从后台初遇重新开始？当前存档会被替换。'))return;closePerformance();leaveAlcove();stopMovement();wide=false;visual.dir={a:1,b:1};s=initial();lockStage(false);playing=false;visual.started=false;visual.look=0;visual.pitch=0;visual.motion={a:newMotion(),b:newMotion()};visual.a=s.a;visual.b=s.b;el('overlay').querySelector('h2').innerHTML=card;el('overlay').querySelector('.panel p').textContent=prologue;el('start').textContent='入戏';curtain(true);render();save()};
for(const k of ['chair','lamp','angle'])el(k).oninput=e=>{
  if(!playing||s.role!=='a')return;
  if(s.stage===3&&s.b>31&&s.b<69){render('拾影还在桥上。先让他走到岸边，再转窗棂。');return}
  adjustProp(k,Number(e.target.value));
};
let speed=0,tapDistance=0,pointer=null,turnRemaining=0;
function stopMovement(){
  held=0;speed=0;turnRemaining=0;tapDistance=0;pointer=null;pressed.clear();
}
for(const [id,dir] of [['left',-1],['right',1]]){
  const btn=el(id);btn.style.touchAction='none';
  btn.onpointerdown=e=>{
    if(!playing||sceneBusy()||e.button!==0||pointer)return;
    e.preventDefault();btn.setPointerCapture(e.pointerId);
    pointer={id:e.pointerId,dir,start:s[s.role]};held=dir;tapDistance=0;
  };
  btn.onpointerup=e=>{
    if(pointer?.id!==e.pointerId)return;
    const distance=Math.abs(s[s.role]-pointer.start);
    tapDistance=dir*Math.max(0,1-distance);pointer=null;held=0;
  };
  btn.onlostpointercapture=btn.onpointercancel=e=>{if(pointer?.id===e.pointerId)stopMovement()};
  btn.onclick=e=>{if(!e.detail&&playing&&!sceneBusy())tapDistance=Math.max(-4,Math.min(4,tapDistance+dir*2))};
}
function release(){stopMovement();last=0;save()}
window.addEventListener('blur',release);window.addEventListener('pagehide',release);
document.addEventListener('visibilitychange',()=>{if(document.hidden)release()});
document.addEventListener('keydown',e=>{
  if(!playing||sceneBusy()||e.ctrlKey||e.altKey||e.metaKey||(e.target.tagName==='INPUT'&&e.key.toLowerCase()!=='q'))return;
  const k=e.key.toLowerCase();
  if(['arrowright','arrowleft','a','d'].includes(k)){
    e.preventDefault();if(!pressed.has(k)){pressed.add(k);tapDistance=0}
  }
  if(k==='q'&&!e.repeat){e.preventDefault();swap()}
  if(k===' '&&!e.repeat&&(e.target.tagName!=='BUTTON'||e.target===el('action'))){e.preventDefault();objectAction()}
});
document.addEventListener('keyup',e=>{pressed.delete(e.key.toLowerCase());save()});
let draw;try{draw=theatre(el('stage3d'))}catch{}
el('stage3d').closest('.stage').classList.toggle('three',!!draw);
let stageCanvas=el('stage3d');
stageCanvas.addEventListener('webglcontextlost',e=>{
  e.preventDefault();
  const replacement=stageCanvas.cloneNode(false);
  for(const handler of ['onpointerdown','onpointermove','onpointerup','onpointercancel','onlostpointercapture'])replacement[handler]=stageCanvas[handler];
  stageCanvas.replaceWith(replacement);stageCanvas=replacement;drag=null;
  draw=theatre(stageCanvas,true);
  stageCanvas.closest('.stage').classList.toggle('three',!!draw);
  redrawUntil=performance.now()+1500;
});
window.addEventListener('resize',()=>{redrawUntil=performance.now()+1000});
let drag=null;
stageCanvas.onpointerdown=e=>{
  if(!playing||!draw||drag||e.button!==0)return;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,start:visual.look,pitch:visual.pitch};
  stageCanvas.setPointerCapture(e.pointerId);
};
stageCanvas.onpointermove=e=>{
  if(!drag||drag.id!==e.pointerId)return;
  visual.pitch=Math.max(-1.5,Math.min(4,drag.pitch+(e.clientY-drag.y)/stageCanvas.clientHeight*7));
  visual.look=Math.max(-.46,Math.min(.46,drag.start+(drag.x-e.clientX)/stageCanvas.clientWidth*1.3));
  redrawUntil=performance.now()+2400;
};
stageCanvas.onlostpointercapture=stageCanvas.onpointercancel=stageCanvas.onpointerup=()=>{drag=null};
let lastSave=0,idleFrame=0;
function tick(time){
  const dt=last?Math.min(.05,(time-last)/1000):1/60;last=time;
  const lastKey=Array.from(pressed).pop();
  const keyDir=lastKey?(lastKey==='d'||lastKey==='arrowright'?1:-1):0;
  if(keyDir||held)tapDistance=0;
  const dir=held||keyDir||Math.sign(tapDistance);
  const walkSpeed=8.4;
  const target=playing&&s.stage<4?dir*walkSpeed:0;
  const reversing=target*speed<0;
  const acceleration=(!dir||reversing)?85:43;
  if(reversing){
    speed-=Math.sign(speed)*Math.min(Math.abs(speed),acceleration*dt);
  }else if(dir&&speed===0&&visual.dir[s.role]!==dir){
    visual.dir[s.role]=dir;turnRemaining=.1;
    redrawUntil=time+900;
  }else if(turnRemaining>0){
    turnRemaining=Math.max(0,turnRemaining-dt);
  }else{
    speed+=Math.sign(target-speed)*Math.min(Math.abs(target-speed),acceleration*dt);
  }
  if(speed){
    const amount=tapDistance?Math.min(Math.abs(tapDistance),Math.abs(speed)*dt):Math.abs(speed)*dt;
    const before=s[s.role];step(Math.sign(speed),amount);
    if(tapDistance&&speed*tapDistance>0){
      tapDistance-=Math.sign(tapDistance)*amount;
      if(Math.abs(tapDistance)<.0001){tapDistance=0;speed=0}
    }
    if(before===s[s.role]){speed=0;tapDistance=0}
    if(time-lastSave>450){save();lastSave=time}
  }
  advanceCarry(dt);
  if(!document.hidden&&(time<redrawUntil||(playing&&!reduced&&time-idleFrame>110))){
    idleFrame=time;
    for(const k of ['a','b']){
      const distance=Math.abs(s[k]-visual[k])*.162,m=visual.motion[k];
      visual[k]=s[k];
      const cycle=1.12;
      const before=m.phase;
      m.phase+=distance*2*Math.PI/cycle;
      if(Math.floor(before/Math.PI)!==Math.floor(m.phase/Math.PI))stageSound.play('step');
      const moving=distance>.00001;
      m.weight+=(Number(moving)-m.weight)*(1-Math.exp(-dt*(moving?22:18)));
      m.yaw+=(visual.dir[k]*Math.PI*.5-m.yaw)*(1-Math.exp(-dt*14));
    }
    if(draw&&(wide||visual.shot||visual.work))draw(s,visual,time/1000,dt);
  }
  requestAnimationFrame(tick);
}
</script><script src="performance.js"></script><script src="alcoves.js"></script><script src="challenge.js"></script><script src="sequence.js"></script><script src="playhouse.js"></script><script>render();requestAnimationFrame(tick);

<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>灯下百戏 · 借影搭桥</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b20;color:#f5e6c4;font-family:Georgia,'Songti SC','Noto Serif SC',serif}button{font:inherit;cursor:pointer;color:inherit}#app{min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 32%,#40595b,#17292c 68%,#101a1e)}header{display:flex;justify-content:space-between;align-items:center;padding:14px 4vw;gap:12px}h1{font-size:clamp(20px,3vw,32px);letter-spacing:.12em;margin:0}header small{color:#c2ae89;letter-spacing:.2em}.tag{border:1px solid #b6986d;border-radius:30px;padding:7px 13px;color:#d8c6a2;font-size:14px}main{width:min(1120px,96vw);margin:auto;position:relative}.frame{border:1px solid #ac9670;box-shadow:0 18px 60px #0008;position:relative;overflow:hidden;border-radius:6px;background:#1c3031}.scene{height:min(53vw,490px);min-height:280px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 70% 60%,#c9a66c55,transparent 40%),linear-gradient(180deg,#4d6969,#91a4a0 53%,#333f3c 54%,#202c29 100%)}.scene:before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 30%,#1f383955 30% 35%,transparent 35%),linear-gradient(30deg,transparent 50%,#253c3c77 50% 56%,transparent 56%);opacity:.45}.moon{position:absolute;right:12%;top:8%;width:74px;aspect-ratio:1;border-radius:50%;background:#f5e4bd;box-shadow:0 0 60px #fae4a866;opacity:.8}.roof{position:absolute;top:24%;left:12%;right:10%;height:52%;background:linear-gradient(90deg,#182b2b 3%,transparent 3% 97%,#182b2b 97%),linear-gradient(#283e3b 5%,#baaa8666 5% 95%,#1d302d 95%);border:10px solid #263b38;box-shadow:0 15px 20px #14242066}.roof:before{content:'';position:absolute;left:-5%;right:-5%;top:-23%;height:25%;background:#223633;clip-path:polygon(0 100%,12% 40%,88% 40%,100% 100%)}.roof:after{content:'戲';position:absolute;top:3%;left:46%;font-size:32px;color:#ccad79}.floor{position:absolute;bottom:0;width:100%;height:17%;background:repeating-linear-gradient(90deg,#304039,#304039 80px,#26352f 82px);border-top:4px solid #c9ab76}.lantern{position:absolute;left:15%;top:23%;font-size:52px;filter:drop-shadow(0 0 18px #ffc866)}.board{position:absolute;top:37%;left:30%;width:44%;height:30%;border:3px solid #ccb383;background:#e5d7afaa;box-shadow:inset 0 0 30px #81704a55}.bridge{position:absolute;left:28%;right:28%;bottom:29%;height:9px;background:#282f2d;transform:scaleX(.22);transition:.4s;transform-origin:left;box-shadow:0 0 12px #efc778}.bridge.ready{transform:scaleX(1);background:#322b24}.platform{position:absolute;bottom:25%;height:8px;background:#322e27;width:26%}.platform.left{left:4%}.platform.right{right:4%}.player{position:absolute;bottom:15%;font-size:58px;line-height:1;z-index:4;transition:left .15s;filter:drop-shadow(0 6px 3px #0009)}.player.shadow{bottom:29%;font-size:45px;filter:sepia(1) brightness(.35) drop-shadow(0 0 8px #ffdc83)}.player.active:after{content:'◆';position:absolute;top:-22px;left:30%;color:#ffdf99;font-size:14px}.prop{position:absolute;bottom:16%;left:42%;font-size:42px;transition:left .2s}.goal{position:absolute;right:12%;bottom:28%;font-size:36px;filter:drop-shadow(0 0 12px #ffd77d)}.hud{position:absolute;top:15px;left:18px;right:18px;display:flex;justify-content:space-between;gap:10px}.hud span{background:#182724d9;border:1px solid #b49d73;color:#f4e3bb;padding:8px 12px;border-radius:5px;font-size:14px}.dialogue{display:flex;gap:14px;padding:18px 24px;background:#182725;min-height:96px;align-items:start;border-top:1px solid #9d8d6a}.speaker{color:#e9bf79;white-space:nowrap;font-weight:bold}.dialogue p{margin:0;line-height:1.7}.panels{display:flex;justify-content:space-between;gap:10px;padding:15px 0 23px;align-items:center;flex-wrap:wrap}.group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{background:#273c37;border:1px solid #ac9670;border-radius:7px;padding:10px 15px;min-height:44px;box-shadow:0 3px 0 #101b18}.btn:hover,.btn:focus-visible{background:#47604d;outline:2px solid #e3c38b}.btn.primary{background:#a04e3c;border-color:#d5aa78}.help{font-size:14px;color:#c5c0aa}.overlay{position:absolute;inset:0;z-index:10;background:#101c1de8;display:grid;place-items:center;text-align:center;padding:20px}.card{max-width:550px}.eyebrow{letter-spacing:.35em;color:#d3ab70}.card h2{font-size:clamp(30px,5vw,52px);margin:12px 0}.card p{line-height:1.9;color:#d6cfba}.overlay[hidden]{display:none}footer{text-align:center;color:#a6af9e;font-size:13px;padding:0 15px 12px}@media(max-width:600px){header{padding:10px 3vw}.tag{font-size:12px}.scene{min-height:300px}.roof{left:7%;right:7%}.dialogue{padding:12px;min-height:100px;font-size:15px}.panels{padding:10px 0}.btn{padding:9px 12px}.player{font-size:46px}.player.shadow{font-size:36px}.help{width:100%}}
</style></head><body><div id="app"><header><div><small>一盏灯 · 两个人 · 一出未完的戏</small><h1>灯下百戏 <span style="font-size:.55em;color:#d4b27d">借影搭桥</span></h1></div><span class="tag">初赛玩法原型</span></header><main><div class="frame"><div class="scene"><div class="moon"></div><div class="roof"></div><div class="board"></div><div class="lantern">🏮</div><div class="platform left"></div><div class="platform right"></div><div id="bridge" class="bridge"></div><div class="floor"></div><div id="prop" class="prop">🪑</div><div id="goal" class="goal">✧</div><div id="azhao" class="player">👤</div><div id="shiying" class="player shadow">♟</div><div class="hud"><span id="chapter"></span><span id="role"></span></div></div><div class="dialogue"><span id="speaker" class="speaker"></span><p id="dialog"></p></div><div id="overlay" class="overlay"><div class="card"><div class="eyebrow">北京文脉 · 光影奇遇</div><h2>借一束光<br>走一段未完的戏</h2><p>旧戏台熄灯了。皮影匠阿照与戏曲皮影拾影相遇，他们要借助彼此的视角，让这座戏台重新亮起来。</p><button class="btn primary" id="start">开始游戏</button><p class="help">进度自动保存在当前浏览器中</p></div></div></div><div class="panels"><div class="group"><button class="btn" id="left" aria-label="向左移动">◀ 左移</button><button class="btn" id="right" aria-label="向右移动">右移 ▶</button><button class="btn primary" id="act">互动</button><button class="btn" id="switch">切换角色</button></div><div class="group"><button class="btn" id="hint">提示</button><button class="btn" id="reset">重新开始</button></div><div class="help">电脑：方向键或 A / D 移动，空格互动，Tab 切换角色</div></div></main><footer>光影之间，故事还在继续。 · 原型画面与音效待完善</footer></div><script>
const $=id=>document.getElementById(id), key='dengxia-prototype-v1';let s={stage:0,role:'a',a:12,b:12,chair:0,light:0,views:0,sleeve:false};try{let x=JSON.parse(localStorage.getItem(key));if(x&&Number.isInteger(x.stage)&&x.stage>=0&&x.stage<=4)s={...s,...x}}catch(e){}let messages=['阿照：这盏旧戏灯，还能亮吗？走近灯下，按互动。','拾影：我的影子散在戏台里了。先把椅子推到灯前，再调整灯光。','拾影：桥连上了！切换到我，走过影桥，在星光处拉开机关。','阿照：窗棂的影子还没连起来。先由我调整视角，再让拾影用长袖拉动机关。','拾影：戏台亮了。阿照，接下来这出戏，我们一起演。'];let hints=['控制阿照走到左边灯下，按互动。','阿照靠近椅子后按互动推椅，再靠近灯按互动调整灯光。','切换拾影，向右走到发光的机关处，按互动。','阿照走到椅子附近按互动两次；再切换拾影，走到右侧机关按互动。','演出结束。进度已保存在当前浏览器。'];function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}function render(msg){$('azhao').style.left=s.a+'%';$('shiying').style.left=s.b+'%';$('azhao').classList.toggle('active',s.role==='a');$('shiying').classList.toggle('active',s.role==='b');$('bridge').classList.toggle('ready',s.stage>=2);$('prop').style.left=(42+s.chair*7)+'%';$('chapter').textContent=['第一幕 · 灯影初醒','第二幕 · 借影搭桥','第二幕 · 影桥','第三幕 · 戏台机关','终幕 · 戏台重明'][s.stage];$('role').textContent=s.role==='a'?'当前：阿照':'当前：拾影';$('speaker').textContent=msg?'提示':(s.stage===0?'阿照':s.stage===1||s.stage===2?'拾影':s.stage===3?'阿照':'拾影');$('dialog').textContent=msg||messages[s.stage].split('：').slice(1).join('：');$('goal').textContent=s.stage===4?'🏮':'✧';save()}
function move(d){if(s.stage===4)return;let k=s.role, x=s[k]+d*5;if(k==='b'&&s.stage<2&&x>27){render('拾影：前面的路断了，要先让阿照连起影桥。');return} s[k]=Math.max(5,Math.min(88,x));render()}
function act(){if(s.stage===0&&s.role==='a'&&s.a<=25){s.stage=1;render('灯亮了。拾影从幕布中醒来：我的影子散在戏台里了。');return}if(s.stage===1&&s.role==='a'){if(s.a>=30&&s.a<=62&&s.chair===0){s.chair=1;render('阿照把椅子推到了灯前。回到左边灯下，调整光线。');return}if(s.a<=25&&s.chair){s.light=1;s.stage=2;render('灯光穿过椅子，影子连成了一座桥。切换拾影，走过去。');return}}if(s.stage===2&&s.role==='b'&&s.b>=70){s.stage=3;s.sleeve=true;render('拾影拉开机关，找回了第一片衣袖。接下来，阿照要调整窗棂的视角。');return}if(s.stage===3&&s.role==='a'&&s.a>=30&&s.a<=65){s.views++;if(s.views>=2){render('窗棂的影子对齐了。切换拾影，走到右侧用长袖拉动机关。')}else render('阿照转动了视角。影子还没有连起来，再互动一次。');return}if(s.stage===3&&s.role==='b'&&s.b>=70&&s.views>=2){s.stage=4;render('拾影伸出长袖，拉下机关。灯亮了，他们一起完成了第一出戏。');setTimeout(()=>{ $('overlay').hidden=false;$('overlay').innerHTML='<div class="card"><div class="eyebrow">第一出戏 · 完</div><h2>灯亮了，戏还未完</h2><p>阿照收起戏灯，发现自己的影子旁多了一个小小的身影。胡同尽头，另一盏旧灯忽然亮起，墙上的陌生剪影轻轻招手。</p><button class="btn primary" onclick="document.getElementById(\'overlay\').hidden=true">回到戏台</button></div>'},900);return}render('这里暂时没有可操作的机关。可以点击“提示”查看下一步。')}
function sw(){if(s.stage===0){render('先点亮戏灯，拾影才能醒来。');return}s.role=s.role==='a'?'b':'a';render()}$('start').onclick=()=>$('overlay').hidden=true;$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('act').onclick=act;$('switch').onclick=sw;$('hint').onclick=()=>render(hints[s.stage]);$('reset').onclick=()=>{if(confirm('确定清除本机进度，重新开始吗？')){s={stage:0,role:'a',a:12,b:12,chair:0,light:0,views:0,sleeve:false};render()}};document.addEventListener('keydown',e=>{if(!$('overlay').hidden)return;if(['ArrowLeft','a','A'].includes(e.key)){e.preventDefault();move(-1)}if(['ArrowRight','d','D'].includes(e.key)){e.preventDefault();move(1)}if(e.key===' '||e.key==='Enter'){e.preventDefault();act()}if(e.key==='Tab'){e.preventDefault();sw()}});render();</script></body></html>

<section id="alcove" hidden aria-labelledby="alcoveTitle"><canvas id="alcoveScene" aria-hidden="true"></canvas><div class="alcove-head"><small id="alcoveAct"></small><h2 id="alcoveTitle" tabindex="-1"></h2><p id="alcoveClue"></p></div><div id="instruments"></div><div class="alcove-foot"><p id="alcoveFeedback" aria-live="polite"></p><button id="repeatCue" type="button">辨听三铃</button></div></section><div id="shutter" aria-hidden="true"></div><div class="sceneLight" aria-hidden="true"></div><div class="overlay" id="overlay"><div class="panel"><div class="kicker">北京皮影戏</div><h2>借影搭桥</h2><p>阿照刚吹灭戏灯，白幕背后就响了三下。旧戏单从门缝滑进来，上面只有半行：“小生过桥，接娘下台。”末尾粘着一根红线。阿照认得这出戏。师父的账上，它一直没勾销。</p><button class="primary" id="start">入戏</button><p class="hint">自动保存在当前设备的浏览器中</p></div></div></section><div class="dialog" aria-live="polite"><strong id="speaker"></strong><p id="dialog"></p></div></div><aside id="gameConsole"><div class="controls"><button id="left">向左</button><button id="right">向右</button><button class="primary" id="action">互动</button><button id="switch">切换角色</button></div><div id="reachStatus"></div><div class="consoleTabs"><button id="toolsTab" aria-pressed="true">操作</button><button id="caseTab" aria-pressed="false">装备与调查</button></div><div id="consoleScroll"><div id="toolsPage"><div class="toolDrawer folded" id="drawer" inert><div class="toolClip"><section class="tools" id="tools"><div class="toolHead"><strong id="toolTitle"></strong><div id="projection" hidden aria-label="投影与左右桥墩的对齐情况"><i></i><b></b><em></em></div></div><label id="chairLabel">移动椅子 <input id="chair" type="range" min="0" max="100" value="25"><output id="chairOut"></output></label><label id="lampLabel">调整灯光 <input id="lamp" type="range" min="0" max="100" value="25"><output id="lampOut"></output></label><label id="angleLabel">转动视角 <input id="angle" type="range" min="0" max="100" value="15"><output id="angleOut"></output></label><div class="hint" id="feedback"></div></section></div></div><div id="propCommands" aria-label="机 'use strict';
const el=id=>document.getElementById(id);
const key='dengxia-shadow-v2';
const initial=()=>({stage:0,role:'a',a:13,b:27,chair:25,lamp:25,angle:15,depth:{a:1.65,b:-.88},alcove:"",chimes:0,tiles:[1,3,2],kit:freshCase()});
function restore(){
  const state=initial();
  try {
    const old=JSON.parse(localStorage.getItem(key));
    if(!old||!Number.isInteger(old.stage)||old.stage<0||old.stage>4)return state;
    state.stage=old.stage;state.role=old.role==='b'&&old.stage?'b':'a';
    for(const k of ['a','b','chair','lamp','angle']){
      if(Number.isFinite(old[k]))state[k]=Math.max(0,Math.min(100,old[k]));
    }
    if((old.passage===2||old.passage===3)&&old.passage===state.stage+1){
      state.stage=old.passage;
    }
    if((old.alcove==='bells'&&state.stage===2)||(old.alcove==='silk'&&state.stage===3)){
      state.alcove=old.alcove;
      if(Number.isInteger(old.chimes)&&old.chimes>=0&&old.chimes<3)state.chimes=old.chimes;
      if(Array.isArray(old.tiles)&&old.tiles.length===3&&old.tiles.every(n=>Number.isInteger(n)&&n>=0&&n<4))state.tiles=old.tiles.slice();
    }
    state.kit=readCase(old,state.stage,state.alcove);
    for(const [k,lo,hi] of [['a',1.58,2.12],['b',-1.08,-.67]]){
      if(Number.isFinite(old.depth?.[k]))state.depth[k]=Math.max(lo,Math.min(hi,old.depth[k]));
    }
    state.a=Math.max(5,Math.min(88,state.a));
    state.b=Math.max(21,Math.min(76,state.b));
    if(state.stage===1&&state.b>31)state.b=31;
    if(state.stage===3&&state.b>31&&state.b<69&&Math.abs(state.angle-70)>5)state.b=state.b<50?31:69;
  } catch {}
  return state;
}
let s=restore(),playing=false,held=0,pressed=new Set(),last=0,redrawUntil=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function newMotion(){return {phase:0,weight:0,yaw:1.5}}
const visual={depth:{...s.depth},look:0,pitch:0,shot:null,started:false,a:s.a,b:s.b,lo:0,hi:0,dir:{a:1,b:1},motion:{a:newMotion(),b:newMotion()}};
const wx=n=>(n-50)*.162;
function isAligned(){
  return s.stage===3?fitsMark('angle',s.angle):fitsMark('chair',s.chair)&&fitsMark('lamp',s.lamp);
}
function ends(){
  if(s.stage===2||s.stage===4||isAligned())return [33,67];
  if(s.stage===3)return [33+(s.angle-70)*.13,67-Math.abs(s.angle-70)*.25];
  return [33+(s.chair-65)*.16,67+(s.lamp-55)*.32];
}
const scenes=['后台初遇','借影搭桥','踏影过桥','窗棂寻纹','点亮戏台'];
const lines=[
  '门闩还插着。谁递的戏单？等我把灯点上。',
  '灯先别灭！我叫拾影。那晚我走到桥心，袖子一紧，灯就黑了。你肯陪我把这一趟走完吗？',
  '站稳了。上回我就停在这儿。东岸缺了一声铃，我娘在幕后等着，一直没听见。',
  '这铜签我认得。我娘拿它开戏衣箱。那晚扯住我的半截袖子，她一直替我收着。',
  '拾影，听。门边那三下，和开灯前一模一样。'
];
const tips=['走到左侧灯架附近，以阿照互动。','移动椅子让桥头对齐，再调灯让桥尾搭上右岸。对齐后按互动固定影桥。','切换拾影，沿影桥走到右岸，在铜铃旁互动。','用阿照转动视角接通两岸，再切换拾影走到左岸，用长袖拉铃。','演出完成，可以在此自由回看戏台。'];
function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch{}}
let captionKey='',captionTimer;
function caption(name,message){
  const key=name+'|'+message;
  if(key===captionKey)return;
  const first=!captionKey, panel=el('dialog').parentElement;
  captionKey=key;
  clearTimeout(captionTimer);
  const commit=()=>{
    el('speaker').textContent=name;
    el('dialog').textContent=message;
    panel.classList.remove('leaving');panel.classList.add('speaking');clearTimeout(panel.hideTimer);panel.hideTimer=setTimeout(()=>panel.classList.remove('speaking'),Math.max(4200,Math.min(8500,message.length*135)));
  };
  if(first||reduced){commit();return}
  panel.classList.add('leaving');
  captionTimer=setTimeout(commit,145);
}
function sceneLine(){
  const row=s.kit[s.stage];
  if(s.stage===1&&row.installed)return '娘给我牵了一辈子线。那晚说好了，东岸的铃一响，我就接她到灯下，跟我鞠一次躬。';
  if(s.stage===2&&row.installed)return '铃舌系好了。让我到东岸去。这一声报场铃，我欠她太久了。';
  if(s.stage===3&&row.installed)return '穗子找回来了。左岸那根铃绳连着绷架，把我的袖子递过去，娘就认得。';
  if(s.stage===3&&row.opened)return '娘的针还在，线也在。阿照，替我把窗眼里那截穗子挑出来，好不好？';
  return lines[s.stage];
}
function render(note){
  const [lo,hi]=ends();visual.lo=wx(lo);visual.hi=wx(hi);

function step(dir,amount){

    }

}

let heldDepth=0,depthTap=0;

let lastSave=0,idleFrame=0;
function tick(time){
  const dt=last?Math.min(.05,(time-last)/1000):1/60;last=time;
  const lastKey=Array.from(pressed).pop();
  const keyDir=['d','arrowright'].includes(lastKey)?1:['a','arrowleft'].includes(lastKey)?-1:0;
  const dz=heldDepth||(['s','arrowdown'].includes(lastKey)?1:['w','arrowup'].includes(lastKey)?-1:Math.sign(depthTap));
  if(dz&&playing&&wide&&!sceneBusy()&&!document.querySelector('dialog[open]')&&s.stage<4){

}

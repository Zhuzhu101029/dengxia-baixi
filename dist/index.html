<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>灯下百戏 · 借影搭桥</title><style>
:root{color-scheme:dark;font-family:'Songti SC','STSong',serif}*{box-sizing:border-box}body{margin:0;background:#142326;color:#f6ebd3}button,input{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #af9270;background:#253d3a;border-radius:6px;min-height:44px;padding:8px 16px}button:hover,button:focus-visible{outline:2px solid #f6d190;outline-offset:2px}.main{max-width:1180px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0 12px}h1{margin:0;font-size:clamp(22px,3vw,32px);letter-spacing:.12em}header small{color:#d4b88a}.badge{font-size:14px;color:#dfc99f;border:1px solid #8e805f;padding:6px 10px;border-radius:30px}.stage{position:relative;overflow:hidden;border:1px solid #a6916e;border-radius:6px;box-shadow:0 15px 50px #0009}.scene{width:100%;height:auto;display:block;min-height:260px;background:#748880}.hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;gap:5px}.hud span{background:#152925dd;border:1px solid #a89066;padding:7px 10px;border-radius:4px;font-size:14px}.dialog{display:flex;gap:14px;padding:16px 20px;min-height:76px;background:#172925;border-top:1px solid #a48b64;line-height:1.65}.dialog strong{color:#e5bd7c;white-space:nowrap}.dialog p{margin:0}.controls{display:flex;flex-wrap:wrap;gap:9px;padding:13px 0;align-items:center}.primary{background:#9c4939;border-color:#d5aa7c}.tools{background:#21342f;border:1px solid #6b7156;padding:12px 16px;border-radius:5px;display:grid;gap:8px}.tools[hidden]{display:none}.tools label{display:grid;grid-template-columns:100px 1fr 48px;align-items:center;gap:12px}.tools input{width:100%;accent-color:#e1b679}.hint{font-size:14px;color:#d0c2a7}.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#132321ec;padding:16px;z-index:5}.overlay[hidden]{display:none}.panel{max-width:600px}.panel h2{font-size:clamp(28px,5vw,48px);margin:12px}.panel p{line-height:1.8;color:#e0d1b4}.kicker{letter-spacing:.3em;color:#e4bd79}footer{font-size:13px;color:#b5bba8;padding:14px 0;text-align:center}@media(max-width:600px){.main{padding:8px}.scene{min-height:260px}.dialog{font-size:15px;padding:12px}.controls{gap:6px}button{padding:8px 10px}.tools label{grid-template-columns:76px 1fr 42px}header small{display:none}}
</style></head><body><main class="main"><header><div><small>一盏灯 · 两个人 · 一出未完的戏</small><h1>灯下百戏 <small>借影搭桥</small></h1></div><span class="badge">光影解谜试玩版</span></header><section class="stage" aria-label="戏台游戏画面"><svg class="scene" viewBox="0 0 1000 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="胡同戏台和影子机关"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#263f44"/><stop offset="1" stop-color="#a4aba0"/></linearGradient><radialGradient id="glow"><stop stop-color="#ffdc9a" stop-opacity=".9"/><stop offset="1" stop-color="#f5cf8c" stop-opacity="0"/></radialGradient><pattern id="lattice" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M0 0H30V30H0Z M0 0L30 30 M30 0L0 30" fill="none" stroke="#876d4d" stroke-opacity=".35"/></pattern></defs><rect width="1000" height="450" fill="url(#sky)"/><circle cx="828" cy="69" r="40" fill="#f3e8cd" opacity=".8"/><path d="M0 290V198L80 166 130 180 170 142 240 166V290 M760 290V168L830 135 890 161 940 137 1000 169V290" fill="#344c49" opacity=".68"/><path d="M180 165 L225 106 H775 L820 165Z" fill="#223c38"/><path d="M168 169 Q188 170 208 150 H792 Q812 170 832 169 L813 179 H187Z" fill="#1a302f"/><rect x="205" y="169" width="590" height="216" fill="#594b39"/><rect x="234" y="185" width="532" height="180" fill="#d3c4a0"/><rect x="234" y="185" width="532" height="180" fill="url(#lattice)"/><path d="M220 174v200 M780 174v200" stroke="#542d28" stroke-width="18"/><rect x="0" y="385" width="1000" height="65" fill="#263a35"/><path d="M0 387 H1000 M0 423 H1000" stroke="#a89976" stroke-width="4"/><circle id="halo" cx="160" cy="238" r="110" fill="url(#glow)"/><g id="lantern" transform="translate(135 194)"><path d="M25 -20V0 M20 50v25" stroke="#59412f" stroke-width="4"/><rect x="5" y="0" width="40" height="52" rx="17" fill="#e6a653" stroke="#693f2c" stroke-width="4"/><path d="M25 4V48 M9 25H41" stroke="#a05b39" stroke-width="3"/></g><path d="M215 310 H332 M670 310 H785" stroke="#544635" stroke-width="11"/><path id="target" d="M332 310 H670" stroke="#b5754e" stroke-width="12" stroke-dasharray="10 12" opacity=".5"/><path id="shadowBridge" d="M332 310 H670" stroke="#392f2a" stroke-width="15" stroke-linecap="round"/><g id="prop" transform="translate(420 330)" stroke="#493425" stroke-width="7" fill="none"><path d="M0 0v44 M55 0v44 M-2 10H58 M0 0h55 M0 0v-45 M55 0v-45 M0 -40h55"/></g><g id="a" transform="translate(100 290)"><circle cx="0" cy="-25" r="17" fill="#e4c4a1"/><path d="M-15 -32 Q0 -52 17 -33 L16 -20 H-16Z" fill="#29322d"/><path d="M-15 -6 L-28 48 H28 L15 -6Z" fill="#a4513e" stroke="#e7c094" stroke-width="3"/><path d="M-10 48l-4 22 M10 48l5 22 M-13 3l-20 22 M13 3l24 18" stroke="#3b3028" stroke-width="7" stroke-linecap="round"/></g><g id="b" transform="translate(270 268)" fill="#33302c" stroke="#e4ba74" stroke-width="2"><circle cx="0" cy="-27" r="14"/><path d="M-16 -38 Q0 -58 16 -38 L12 -32 H-12Z M-10 -10 L-25 34 H25 L10 -10Z"/><path d="M-9 33l-8 25 M9 33l8 25 M-10 -5l-20 21 M10 -5l23 18" fill="none" stroke-width="6"/><circle cx="0" cy="10" r="5" fill="#d09c5b"/></g><g id="goal" transform="translate(730 240)" fill="#f5d18b"><path d="M0 -20L5 -5 20 0 5 5 0 20 -5 5 -20 0 -5 -5Z"/></g><text x="500" y="145" fill="#e8c991" font-size="22" text-anchor="middle">燈 下 百 戲</text></svg><div class="hud"><span id="chapter"></span><span id="role"></span></div><div class="dialog" aria-live="polite"><strong id="speaker"></strong><p id="dialog"></p></div><div class="overlay" id="overlay"><div class="panel"><div class="kicker">北京文脉 · 光影奇遇</div><h2>借一束光<br>走一段未完的戏</h2><p>旧戏台熄了灯。阿照与皮影小生拾影相遇，他们需要借助彼此的视角，找回散落的影子。</p><button class="primary" id="start">进入戏台</button><p class="hint">自动保存在当前设备的浏览器中</p></div></div></section><div class="controls"><button id="left">向左</button><button id="right">向右</button><button class="primary" id="action">互动</button><button id="switch">切换角色</button><button id="hint">提示</button><button id="reset">重新开始</button></div><section class="tools" id="tools" hidden><strong id="toolTitle"></strong><label id="chairLabel">移动椅子 <input id="chair" type="range" min="0" max="100" value="25"><output id="chairOut"></output></label><label id="lampLabel">调整灯光 <input id="lamp" type="range" min="0" max="100" value="25"><output id="lampOut"></output></label><label id="angleLabel">转动视角 <input id="angle" type="range" min="0" max="100" value="15"><output id="angleOut"></output></label><div class="hint" id="feedback"></div></section><p class="hint">电脑：方向键或 A、D 移动，空格互动，Q 切换角色。手机：点击上方按钮操作。</p><footer>第一出戏 · 光影玩法试玩版</footer></main><script>
const $=x=>document.getElementById(x), KEY='dengxia-shadow-v2';const initial=()=>({stage:0,role:'a',a:13,b:27,chair:25,lamp:25,angle:15});let s=initial();try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&Number.isInteger(v.stage)&&v.stage>=0&&v.stage<=4){for(const k of ['a','b','chair','lamp','angle'])if(typeof v[k]!=='number'||!Number.isFinite(v[k]))throw Error('invalid');s={...s,...v};s.role=s.role==='b'?'b':'a'}}catch(e){s=initial()}
const descriptions=['阿照：这盏旧戏灯，还能亮吗？走近灯下，按互动。','拾影：影路断了。阿照，把椅子的影子与虚线连起来。','拾影：桥连上了。换我走到右侧的星光处，拉开机关。','拾影：我找回了一片衣袖。阿照，转动视角，让窗棂的影子重新对齐。','阿照：灯亮了。拾影，接下来这出戏，我们一起演。'];const hints=['阿照走到左侧灯下，点互动。','拖动“移动椅子”和“调整灯光”，观察影子，直到它覆盖虚线。','切换拾影，向右走到星光旁，点互动。','切换阿照，拖动“转动视角”使影子覆盖虚线；再切换拾影，到星光旁点互动。','你已完成这一出戏。可点重新开始再次体验。'];function aligned(){return Math.abs(s.chair-65)<=6&&Math.abs(s.lamp-55)<=6}function angleAligned(){return Math.abs(s.angle-70)<=6}function save(){try{localStorage.setItem(KEY,JSON.stringify(s));return true}catch(e){return false}}
function render(message){$('a').setAttribute('transform',`translate(${s.a*10} 315)`);$('b').setAttribute('transform',`translate(${s.b*10} 272)`);$('a').style.opacity=s.role==='a'?'1':'.72';$('b').style.opacity=s.stage===0?'.25':s.role==='b'?'1':'.68';$('prop').setAttribute('transform',`translate(${330+s.chair*2.5} 330)`);$('lantern').setAttribute('transform',`translate(${100+s.lamp*.7} 194)`);$('halo').setAttribute('cx',125+s.lamp*.7);const diff=s.stage===3?Math.abs(s.angle-70):Math.abs(s.chair-65)+Math.abs(s.lamp-55);let scale=Math.max(.22,1-Math.min(diff,90)/115), shift=s.stage===3?(s.angle-70)*.5:(s.chair-65)*.35-(s.lamp-55)*.3;$('shadowBridge').setAttribute('d',`M${332+shift} 310 h${338*scale}`);$('shadowBridge').setAttribute('stroke',((s.stage===1&&aligned())||(s.stage===3&&angleAligned())||s.stage===2||s.stage===4)?'#49302a':'#554a42');$('chapter').textContent=['第一幕 · 灯影初醒','第二幕 · 借影搭桥','第二幕 · 影桥','第三幕 · 戏台机关','终幕 · 戏台重明'][s.stage];$('role').textContent=s.role==='a'?'当前：阿照':'当前：拾影';let d=message||descriptions[s.stage], parts=d.split('：');$('speaker').textContent=parts.length>1?parts.shift():'提示';$('dialog').textContent=parts.join('：')||d;$('tools').hidden=!(s.role==='a'&&(s.stage===1||s.stage===3));$('chairLabel').hidden=s.stage!==1;$('lampLabel').hidden=s.stage!==1;$('angleLabel').hidden=s.stage!==3;$('toolTitle').textContent=s.stage===1?'让影子覆盖虚线，形成桥':'转动视角，让影子覆盖虚线';for(const k of ['chair','lamp','angle']){$(k).value=s[k];$(k+'Out').value=s[k]}$('feedback').textContent=s.stage===1?(aligned()?'影桥已对齐，按互动固定。':'观察影子的位置和长度，调整到覆盖整条虚线。'):angleAligned()?'影子已对齐，可切换拾影操作机关。':'调整视角，观察影子与虚线的位置。';$('target').setAttribute('opacity',s.stage===1||s.stage===3?'.7':'.15');if(!save())$('feedback').textContent+=' 当前浏览器不允许保存进度。'}
function move(d){if(s.stage===4)return;let k=s.role;let x=Math.max(k==='a'?5:21,Math.min(k==='a'?88:75,s[k]+d*5));if(k==='b'&&s.stage===1&&x>33){render('拾影：影桥还没有接通。');return}s[k]=x;render()}
function action(){if(s.stage===0&&s.role==='a'&&s.a<=25){s.stage=1;render('拾影：我的影子散在戏台里了。阿照，试着调整椅子和灯光。');return}if(s.stage===1&&s.role==='a'){if(aligned()){s.stage=2;render('阿照：影子连成桥了。拾影，你试着走过去。')}else render('阿照：影子还没有覆盖虚线，再调整椅子和灯光。');return}if(s.stage===2&&s.role==='b'&&s.b>=65){s.stage=3;s.a=45;render('拾影：找回一片衣袖了！阿照，你能从另一边调整视角吗？');return}if(s.stage===3&&s.role==='b'&&s.b>=65&&angleAligned()){s.stage=4;render();setTimeout(()=>{$('overlay').hidden=false;$('overlay').innerHTML='<div class="panel"><div class="kicker">第一出戏 · 完</div><h2>灯亮了，戏还未完</h2><p>阿照收起戏灯，发现自己的影子旁多了一个小小的身影。胡同尽头，另一盏旧灯忽然亮起，墙上的陌生剪影轻轻招手。</p><button onclick="document.getElementById(\'overlay\').hidden=true">回到戏台</button></div>'},500);return}render('这里暂时没有可操作的机关。点击“提示”看看下一步。')}
function switchRole(){if(s.stage===0){render('阿照：先点亮戏灯。');return}s.role=s.role==='a'?'b':'a';render()}$('start').onclick=()=>$('overlay').hidden=true;$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('action').onclick=action;$('switch').onclick=switchRole;$('hint').onclick=()=>render(hints[s.stage]);$('reset').onclick=()=>{if(confirm('确定清除当前设备的进度并重新开始？')){s=initial();render()}};for(const k of ['chair','lamp','angle'])$(k).oninput=e=>{s[k]=Number(e.target.value);render()};document.addEventListener('keydown',e=>{if(!$('overlay').hidden||e.target.tagName==='INPUT')return;if(['ArrowLeft','a','A'].includes(e.key)){e.preventDefault();move(-1)}else if(['ArrowRight','d','D'].includes(e.key)){e.preventDefault();move(1)}else if(e.key===' '){e.preventDefault();action()}else if(e.key.toLowerCase()==='q'){e.preventDefault();switchRole()}});render();
</script></body></html>
